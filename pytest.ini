[pytest]
# Pytest configuration for luminous ray tracer tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options - minimal by default
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Test paths
testpaths = tests

# Markers for categorizing tests
markers =
    basic: Basic illumination tests
    shadow: Shadow casting tests
    reflection: Reflection tests
    transmission: Transmission tests
    integration: Integration tests
    slow: Tests that take longer to run
